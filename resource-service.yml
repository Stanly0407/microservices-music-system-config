# Centralized configuration for resource-service, served by the Config Server.
spring:
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:guest}"
    password: "${RABBITMQ_PASSWORD:guest}"

cloud:
  aws:
    s3:
      endpoint: "${AWS_S3_ENDPOINT:http://localhost:4566}"
      bucket: "${AWS_S3_BUCKET:mp3-resources}"
    credentials:
      access-key: "${AWS_ACCESS_KEY:test}"
      secret-key: "${AWS_SECRET_KEY:test}"
    region: "${AWS_REGION:us-east-1}"
