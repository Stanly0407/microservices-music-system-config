spring:
  cloud:
    gateway:
      routes:
        - id: resource-service
          uri: lb://resource-service
          predicates:
            - Path=/resources/**
        - id: song-service
          uri: lb://song-service
          predicates:
            - Path=/songs/**
        - id: song-service-config-info
          uri: lb://song-service
          predicates:
            - Path=/config-info
        - id: storage-service
          uri: lb://storage-service
          predicates:
            - Path=/storages/**
