# Centralized configuration for api-gateway, served by the Config Server.
# Spring Cloud Gateway automatically re-reads this route list when
# /actuator/refresh (or /actuator/gateway/refresh) is called, so route
# changes here take effect without redeploying the gateway.
spring:
  cloud:
    gateway:
      routes:
        - id: resource-service
          uri: lb://resource-service
          predicates:
            - Path=/resources/**
        - id: song-service
          uri: lb://song-service
          predicates:
            - Path=/songs/**
